<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgentCabin Eval - Dynamic Postcondition Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    button { padding: 8px 16px; font-size: 14px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #messageArea { margin-top: 20px; font-size: 16px; font-weight: 500; color: #333; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid #ccc; border-top-color: #007aff; border-radius: 50%; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>Dynamic Async Evaluation</h1>
  <p>Tests delayed postcondition resolution via wait_for / expect.</p>
  <button id="triggerBtn" onclick="triggerAsyncAction()">Load Message</button>
  <div id="messageArea"></div>

  <script>
    function triggerAsyncAction() {
      const area = document.getElementById("messageArea");
      area.innerHTML = '<span class="spinner"></span> Loading...';
      setTimeout(() => {
        area.innerHTML = '<div id="loadedResult" role="status">Delayed message loaded successfully</div>';
      }, 400);
    }
  </script>
</body>
</html>
