<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AgentCabin Eval - Form Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="text"] { width: 300px; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; font-size: 14px; background: #007aff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    #status { margin-top: 16px; font-weight: bold; color: #28a745; display: none; }
  </style>
</head>
<body>
  <h1>Deterministic Form Evaluation</h1>
  <form id="testForm" onsubmit="event.preventDefault(); handleSubmit();">
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" placeholder="Enter username" />
    </div>
    <div class="form-group">
      <button type="submit" id="submitBtn">Submit Form</button>
    </div>
  </form>
  <div id="status">Submitted: <span id="statusVal"></span></div>

  <script>
    function handleSubmit() {
      const val = document.getElementById("username").value;
      document.getElementById("statusVal").textContent = val;
      document.getElementById("status").style.display = "block";
    }
  </script>
</body>
</html>
