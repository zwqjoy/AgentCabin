[package]
name = "AgentCabin"
version = "0.2.1"
edition = "2021"
description = "Local-first desktop app for AI-assisted vibe coding"
license = "Apache-2.0"

[lib]
name = "agentcabin_desktop_lib"
crate-type = ["lib"]

[[bin]]
name = "AgentCabin"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.9", features = ["serde"] }
base64 = "0.22"
strip-ansi-escapes = "0.2"
notify = "7"
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
log = "0.4"

once_cell = "1"
env_logger = "0.11"
sha2 = "0.10"
url = "2"
tauri-plugin-global-shortcut = "2"
mime_guess = "2.0"
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
include_dir = "0.7"
rand = "0.8"
if-addrs = "0.15.0"
urlencoding = "2"
rayon = "1"
toml = "0.8"
toml_edit = "0.22"
portable-pty = "0.9"
zip = "2"
va-ai-api-bridge = "=0.1.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[features]
work-smoke = []
